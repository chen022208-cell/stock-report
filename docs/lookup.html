<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個股查詢 · 盤後快訊</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1C1B19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171615; --surface:#221F1D; --surface-2:#2A2725; --surface-3:#332F2B;
    --text-primary:#F2EEE6; --text-secondary:#ABA398; --text-muted:#786F63;
    --red:#E15C4F; --green:#4FB07A; --gold:#E3AC4E; --hairline:#38332E;
    /* 分類色：跟紅漲綠跌語意分開，只用來標「這是哪一種資訊」 */
    --c-market:#6C93F5; --c-theme:#B48CE8; --c-chip:#EC9A5C; --c-score:#43BFAE;
    --c-warn:#E15C4F;
    --radius:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg); color:var(--text-primary);
       font-family:'Noto Sans TC',sans-serif; line-height:1.65;
       -webkit-font-smoothing:antialiased;}
  .page{max-width:720px; margin:0 auto; padding:20px 16px 72px;}
  a{color:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}
  /* 台股慣例：紅漲綠跌。切勿套用美股配色，會讓人看反方向 */
  .up{color:var(--red);} .down{color:var(--green);}
  hr.divider{border:none; border-top:1px solid var(--hairline); margin:22px 0;}

  /* 頂部像 App 的水平捲動分類籤條，取代原本會換行的純文字導覽 */
  .nav{display:flex; gap:8px; margin-bottom:20px; overflow-x:auto;
       -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{flex-shrink:0; text-decoration:none; font-size:13px; font-weight:500;
        color:var(--text-secondary); background:var(--surface);
        padding:9px 14px; border-radius:100px; border:1px solid var(--hairline);
        white-space:nowrap; transition:background .15s,color .15s;}
  .nav a:hover,.nav a:focus-visible{color:var(--text-primary); background:var(--surface-2);}
  .nav a.current{color:#171615; background:var(--gold); border-color:var(--gold); font-weight:600;}

  .masthead-label{font-size:13px; color:var(--text-muted); margin-bottom:4px;}
  .masthead-date{font-family:'Noto Serif TC',serif; font-weight:600; font-size:24px;}

  .block{margin-bottom:4px;}
  .block h2{font-family:'Noto Serif TC',serif; font-weight:600;
            font-size:18px; margin-bottom:14px;}
  .commentary{font-size:14.5px; color:var(--text-secondary); line-height:1.8;}

  .tag{font-size:11.5px; padding:3px 9px; border-radius:100px; white-space:nowrap;
      font-weight:500;}
  .tag.confidence-high{background:rgba(227,172,78,.18); color:var(--gold);}
  .tag.confidence-mid{background:rgba(171,163,152,.16); color:var(--text-secondary);}
  .tag.confidence-low{background:rgba(120,111,99,.18); color:var(--text-muted);}
  .tag.verdict-real{background:rgba(79,176,122,.18); color:var(--green);}
  .tag.verdict-watch{background:rgba(225,92,79,.18); color:var(--red);}
  .tag.watchlist{background:rgba(227,172,78,.22); color:var(--gold);}

  /* 通用卡片元件：儀表板／格狀資訊都吃這組，密度比原本文章式排版高 */
  .card{background:var(--surface); border-radius:var(--radius); padding:16px;
       border:1px solid var(--hairline);}
  .card-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .card-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .stat-tile{background:var(--surface); border-radius:var(--radius-sm);
            padding:13px 14px; border-left:3px solid var(--hairline);}
  .stat-tile.c-market{border-left-color:var(--c-market);}
  .stat-tile.c-theme{border-left-color:var(--c-theme);}
  .stat-tile.c-chip{border-left-color:var(--c-chip);}
  .stat-tile.c-score{border-left-color:var(--c-score);}
  .stat-tile.c-warn{border-left-color:var(--c-warn);}
  .stat-tile .stat-tile-label{font-size:11.5px; color:var(--text-muted); margin-bottom:5px;
                              display:flex; align-items:center; gap:5px;}
  .stat-tile .stat-tile-value{font-family:'JetBrains Mono',monospace; font-size:19px;
                              font-weight:500; line-height:1.2;}
  .stat-tile .stat-tile-sub{font-size:12px; color:var(--text-secondary); margin-top:3px;}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .dot.c-market{background:var(--c-market);} .dot.c-theme{background:var(--c-theme);}
  .dot.c-chip{background:var(--c-chip);} .dot.c-score{background:var(--c-score);}
  .dot.c-warn{background:var(--c-warn);}

  /* 快速連結格：首頁用，取代純文字清單 */
  .quicklink-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .quicklink{display:block; background:var(--surface); border:1px solid var(--hairline);
            border-radius:var(--radius-sm); padding:13px 14px; text-decoration:none;
            transition:background .15s, transform .1s;}
  .quicklink:active{transform:scale(.98);}
  .quicklink:hover{background:var(--surface-2);}
  .quicklink .ql-title{font-size:14px; font-weight:600; color:var(--text-primary);
                       display:flex; align-items:center; gap:7px; margin-bottom:3px;}
  .quicklink .ql-desc{font-size:12px; color:var(--text-muted);}

  footer.site-footer{margin-top:36px; padding-top:18px;
                     border-top:1px solid var(--hairline);}
  footer.site-footer p{font-size:12px; color:var(--text-muted);
                       margin-bottom:6px; line-height:1.6;}

  @media (max-width:480px){
    .page{padding:14px 12px 64px;}
    .masthead-date{font-size:21px;}
    .card-grid.cols-3{grid-template-columns:repeat(2,1fr);}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}

  .search-box{width:100%; background:var(--surface); border:1px solid var(--hairline);
             border-radius:var(--radius-sm); padding:13px 14px; font-size:15px;
             color:var(--text-primary); margin-bottom:6px;}
  .search-box::placeholder{color:var(--text-muted);}
  .search-hint{font-size:12px; color:var(--text-muted); margin-bottom:16px;}
  .lookup-empty{font-size:13.5px; color:var(--text-muted); padding:24px 0; text-align:center;}
  .lookup-result{display:block; background:var(--surface); border:1px solid var(--hairline);
                border-radius:var(--radius-sm); padding:13px 14px; margin-bottom:8px;
                text-decoration:none; color:inherit;}
  .lookup-result:active{opacity:.7;}
  .lr-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .lr-name{font-size:14.5px; font-weight:600;}
  .lr-pct{font-family:'JetBrains Mono',monospace; font-size:14px;}
  .lr-meta{font-size:12px; color:var(--text-muted); margin-top:4px; display:flex; gap:8px; align-items:center;}
  .lr-badge{font-size:10.5px; padding:1px 7px; border-radius:100px;
           background:rgba(227,172,78,.18); color:var(--gold);}

</style>
</head>
<body>
<div class="page">
  <nav class="nav">
    <a href="index.html" class="">最新</a>
    <a href="heatmap.html" class="">🔥 熱力圖</a>
    <a href="chips.html" class="">💰 籌碼</a>
    <a href="scores.html" class="">⭐ 評分</a>
    <a href="lookup.html" class="current">🔍 個股查詢</a>
    <a href="disposition.html" class="">⚠️ 處置</a>
    <a href="themes.html" class="">題材庫</a>
    <a href="archive.html" class="">歷史</a>
    <a href="weekly/index.html" class="">📅 週報</a>
    <a href="monthly-deep/index.html" class="">🌍 深度月報</a>
  </nav>

  
<header><div class="masthead-label">盤後快訊</div>
<h1 class="masthead-date">個股查詢</h1></header>
<p class="commentary" style="margin-top:14px">輸入股票代號或名稱搜尋。有 ⭐ 標記的個股已有完整五面向評分、K 線圖與公司分析；其餘個股僅顯示當日產業熱力圖裡的漲跌幅資料，尚無深度分析。</p>

<input type="text" class="search-box" id="stock-search" placeholder="輸入股票代號或名稱，例如 2330 或 台積電" autocomplete="off">
<div class="search-hint">目前收錄 <span id="stock-count">—</span> 檔個股</div>
<div id="lookup-results"></div>



  <footer class="site-footer">
    <p>資料來源：TWSE、公開資訊觀測站、國際財經資料源　·　產出時間 2026-09-05 13:20</p>
    <p>本頁面為系統自動生成之市場資訊整理，僅供個人研究參考，不構成投資建議。</p>
  </footer>
</div>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>

<script>
(function () {
  var input = document.getElementById("stock-search");
  var results = document.getElementById("lookup-results");
  var countEl = document.getElementById("stock-count");
  var rel = "";
  var stocks = [];

  fetch(rel + "data/stock_index.json").then(function (r) { return r.json(); }).then(function (data) {
    stocks = data.stocks || [];
    countEl.textContent = stocks.length;
    render(stocks.slice(0, 20));
  }).catch(function () {
    countEl.textContent = "0";
    results.innerHTML = '<p class="lookup-empty">個股清單載入失敗，請稍後再試。</p>';
  });

  function render(list) {
    if (!list.length) {
      results.innerHTML = '<p class="lookup-empty">找不到符合的個股</p>';
      return;
    }
    results.innerHTML = list.map(function (s) {
      var href = s.has_score
        ? rel + "scores.html#score-" + s.code
        : rel + "heatmap.html";
      var pctClass = s.change_pct >= 0 ? "up" : "down";
      var badge = s.has_score ? '<span class="lr-badge">⭐ 完整分析</span>' : "";
      return '<a class="lookup-result" href="' + href + '">' +
        '<div class="lr-head"><span class="lr-name">' + s.code + " " + s.name + '</span>' +
        '<span class="lr-pct ' + pctClass + '">' + (s.change_pct >= 0 ? "+" : "") + s.change_pct.toFixed(2) + '%</span></div>' +
        '<div class="lr-meta"><span>' + s.industry + '</span>' + badge + '</div></a>';
    }).join("");
  }

  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    if (!q) { render(stocks.slice(0, 20)); return; }
    var matched = stocks.filter(function (s) {
      return s.code.indexOf(q) === 0 || s.name.toLowerCase().indexOf(q) !== -1;
    });
    render(matched.slice(0, 50));
  });
})();
</script>

</body>
</html>
