name: 市場報告排程

on:
  # 早報/盤後/月報已改由 Claude Code Routine 驅動（LLM_AGENT_MODE=1，吃 Pro/Max
  # 額度、不打計量 API），對應 Routine「台股每日早報」「台股每日盤後」。2026-09-05
  # 已確認該雲端環境的網路政策（Default environment → Network access）調整後可以
  # 正常連線 www.twse.com.tw 等資料源，兩個 Routine 已重新啟用。這裡拿掉 schedule，
  # 只保留手動觸發，當 Routine 掛掉或環境網路政策又跳回限制時的備援。
  workflow_dispatch:          # 也可以在 GitHub 網頁上手動觸發，方便測試或備援
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'evening'
        type: choice
        options: [morning, evening, monthly, holiday, site, catalog]

permissions:
  contents: write             # 需要寫回 docs/ 與 data/ 才能累積歷史

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原個股日線快取
        # data/prices.db 不進 git（見 .gitignore），改用 Actions cache 跨次執行保留。
        # key 用 run_id 保證每次都是新 key（一定 miss），靠 restore-keys 撈「最新一份
        # 前綴相符」的舊快取；job 結束時 actions/cache 會自動把當次結果存成新的一筆，
        # 讓快取逐日累積，量能倍數才能少打即時 API（見 src/prices_db.py）。
        uses: actions/cache@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: |
            prices-db-

      - name: 決定執行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "slot=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 23 * * 0-4" ]; then
            echo "mode=auto" >> $GITHUB_OUTPUT
            echo "slot=morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 10 12 * *" ]; then
            echo "mode=monthly" >> $GITHUB_OUTPUT
            echo "slot=" >> $GITHUB_OUTPUT
          else
            echo "mode=auto" >> $GITHUB_OUTPUT
            echo "slot=evening" >> $GITHUB_OUTPUT
          fi

      - name: 產出報告
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: '0'
        run: python -m src.main ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.slot }}

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          # 沒有變更時 commit 會失敗，用 diff 判斷避免整個 job 標紅
          if git diff --staged --quiet; then
            echo "無變更，略過 commit"
            exit 0
          fi
          git commit -m "報告更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # main 可能在這個 job 執行期間被別的推送更新過（例如手動 push、或另一次排程剛好重疊），
          # push 前先 pull --rebase，失敗再重試幾次，避免非快轉推送直接把整個 job 標紅
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被拒絕，pull --rebase 後重試（第 $i 次）"
            git pull --rebase origin main
            sleep 3
          done
          git push

      - name: 失敗時通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ 報告排程執行失敗，請查看 GitHub Actions log。"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MSG\"}"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MSG"
          fi
