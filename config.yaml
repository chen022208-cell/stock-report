# ── 盤後快訊系統設定檔 ────────────────────────────────
# 這個檔案是你日常唯一需要修改的地方，程式邏輯不用動。

site:
  title: "盤後快訊"
  base_url: "https://chen022208-cell.github.io/stock-report"
  timezone: "Asia/Taipei"

# ── 你的自選股 ──────────────────────────────────────
# 出現在題材/技術面/黑馬名單時，會被標記並置頂到報告最前面
watchlist:
  - code: "2330"
    name: "台積電"
  - code: "2317"
    name: "鴻海"
  - code: "2454"
    name: "聯發科"

# ── 強勢股掃描門檻 ──────────────────────────────────
screener:
  min_change_pct: 4.0        # 漲幅門檻（%）
  min_volume_ratio: 2.0      # 成交量須為 20 日均量的幾倍
  min_turnover: 100000000    # 最低成交金額（元），濾掉冷門股
  top_n: 30                  # 最多取幾檔進入題材分析

# ── 黑馬判定 ────────────────────────────────────────
dark_horse:
  volume_ratio: 3.0          # 量能倍數超過此值視為異常
  max_peers: 1               # 同題材呼應個股數 <= 此值視為孤立訊號

# ── 起漲點雷達（剛突破月線/季線＋爆量，跟 screener 分開，門檻故意放低）──
breakout:
  min_change_pct: 1.5        # 漲幅門檻遠低於 screener，不用已經噴才抓得到
  min_turnover: 30000000     # 最低成交金額（元）
  pre_filter_top_n: 80       # 零成本篩完後，最多對幾檔抓歷史算突破訊號
  fresh_days: 3              # 站上月線/季線幾天內算「剛突破」
  volume_ratio_min: 2.5      # 爆量門檻（20 日均量的幾倍），比 screener 更嚴格
  extended_pct: 15.0         # 近 N 日已漲超過這個百分比 → 判定已延伸、非起漲點
  extended_lookback_days: 10
  top_n: 10                  # 最多列幾檔進報告

# ── 新掛牌觀察 ──────────────────────────────────────
new_listing:
  days: 180                  # 上市/上櫃未滿幾天算「新股」

# ── 題材目錄補齊（117 個種子題材，逐批研究補上代表股與現況）────
theme_catalog:
  batch_size: 40              # 每次（每天）最多研究幾個目錄題材，控制 LLM 成本
  refresh_days: 30            # 已研究過的題材，幾天後才排入下一輪重新檢查
  hot_change_pct: 3.0         # 代表股漲幅達此門檻算「當紅」的一檔
  hot_min_stocks: 2           # 當紅代表股要有幾檔才判定整個題材當紅、值得深度分析
  deep_dive_batch_size: 10    # 每次最多寫幾篇目錄題材的產業分析深度報告（字數較多，批次故意小一點）

# ── 個股公司介紹＋SWOT（只補系統實際分析過、會出現在網站上的個股）────
#    名單＝評分頁 rows＋追蹤中題材相關個股＋選股雷達起漲點/黑馬（不含興櫃新掛牌）。
#    不確定的公司 LLM 會整檔略過，寧缺勿錯，不追求全市場覆蓋。
stock_swot:
  batch_size: 100           # （已停用 process_stock_swot_batch，保留設定不影響其他流程）
  refresh_days: 180
  # 上櫃／興櫃日K快照改走 Yahoo（一次一檔給兩年、0.1 秒／檔），全市場約 1250 檔
  # 只要 ~2 分鐘，所以不再分批輪流補：0 = 不限檔數，每天全市場都補齊。
  # 以前設 120 的後果是新掛牌個股要等好幾天才輪得到，彈窗顯示「查無股價資料」。
  snapshot_limit: 0
  snapshot_fresh_hours: 20  # 快照幾小時內算新鮮就不重抓（跨過每天盤後即失效）
  profile_limit: 200        # 每次最多抓幾檔公司基本資料（抓過就不再抓）

# ── 個股逐檔查證（排程「台股個股逐檔查證」→ python -m src.main verify-stocks）──
# 跟已停用的全市場 SWOT 回填不同：每檔都要 WebSearch 鉅亨／Goodinfo／財報狗／
# 官網／年報實際查證，回覆一定要帶 sources，查不到就不寫。範圍依市值由大到小。
stock_verify:
  # 每天逐檔查證幾檔。全市場有申報營業項目的是 2345 檔，10 檔/天要 234 天才跑得完，
  # 使用者反映「有些個股有公司介紹有些沒有」正是這個進度問題。提高到 40 檔/天
  # 約 2 個月可覆蓋全市場。**不要改成批次一次補完**——那樣一定會變成憑股票名稱
  # 瞎猜的假資料（歷史事故：7686 捷立康被寫成 PCB 廠），已經整批清空過一次。
  daily_count: 40           # 每天逐檔查證幾檔（每檔仍須 WebSearch 查證＋附 sources）
  refresh_days: 180         # 已查證的分析幾天後排入重新查證

# ── 盤中強勢股篩選（方案①：GitHub Actions 迴圈式，python -m src.main intraday）──
# 資料走 mis.twse.com.tw 即時報價；結果寫到 intraday-data 分支，前端每 45 秒重讀。
# 門檻先給保守值，之後拿實際盤中資料回測再調（架構書一再強調不要直接套他人參數）。
intraday:
  min_price: 10                    # Layer 0：排除低價股
  rs_market_threshold: 1.0         # Layer 1：對大盤相對強度 ≥ 幾 %（個股漲幅 − 大盤漲幅）
  rs_full_pct: 5.0                 # 評分用：領先大盤/同業 5% 給滿分
  volume_ratio_threshold: 1.5      # Layer 2：昨量比（時間校正）≥ 幾倍才算量增
  vol_full_ratio: 3.0             # 評分用：昨量比達 (1+3)=4 倍給滿分
  min_confidence_fraction: 0.05    # 已過盤比例低於此值 → 標記 low_confidence（開盤初期）
  tier_a: 80
  tier_b: 60
  list_cap: 40                     # A／B 名單各最多顯示幾檔（JSON 大小與畫面長度）
  display_delay_min: 15            # 公開頁面顯示的資料延遲（分鐘），避開即時報價轉發爭議
  deep_report_min_score: 82        # A 級且分數 ≥ 此值才進深度快報候選
  deep_report_daily_cap: 5         # 每日深度快報上限（雲端 Routine 那邊會再擋一次）
  deep_report_cooldown_hours: 6    # 同一檔幾小時內不重複發快報
  weights:                         # 綜合評分權重（架構書第五節；委買賣力道那 5% 資料源不支援，略）
    rs_market: 25
    rs_sector: 20
    volume: 25
    pattern: 15
    long_term_high: 10

# ── 使用者研究提交（submit.html → GitHub Issue 或 Google 表單）──
research_intake:
  # Google 表單：讓不需要 GitHub 帳號的訪客也能提交，見 submit.html 的說明。
  # 三個值都是設定表單時就拿到的公開網址／欄位 ID，不是密鑰，可以直接寫在這裡。
  google_form_action_url: "https://docs.google.com/forms/d/e/1FAIpQLSccgfQ_dQwSCfgXwIjT3rYXw943GU_I-D_bYrRnuybxjkE4tw/formResponse"
  google_form_entry_title: "entry.1302450198"  # 「標題」欄位
  google_form_entry_body: "entry.412555711"    # 「內容」欄位
  google_sheet_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTEbTSr1aYuLRJ0kc8Herw0Lx1DLQ7QpP9i3wmqNuO2OJt1F66B_XmontAOUP0Cc2qSu-PT8T98drRC/pub?output=csv"

# ── 即時快訊監控（華爾街見聞 live/global）─────────────────
news_monitor:
  channel: "global-channel"
  fetch_limit: 30      # 每次抓最近幾則
  score_min: 2         # 華爾街見聞自己的重要度門檻（1 是一般、2 以上算重要）

# ── 題材知識庫退場機制 ──────────────────────────────
theme_lifecycle:
  dormant_after_days: 7      # 連續 N 個交易日無新訊號 → 休眠
  archive_after_declines: 3  # 信心度連續下滑 N 次且已達低檔 → 退場
  deep_dive_min_days: 1      # 信心度中高以上即可產出深度報告，不等追蹤天數累積

# ── 事後驗證 ────────────────────────────────────────
review:
  horizons_days: [14, 30]    # 回頭檢查 N 天前的判斷準不準

# ── 技術分析 ────────────────────────────────────────
technical:
  lookback_days: 120         # 抓多久的日 K 來算指標
  ma_periods: [5, 20, 60]
  rsi_overbought: 70
  rsi_oversold: 30

# ── LLM ─────────────────────────────────────────────
llm:
  # Sonnet 5：比 4-6 新、輸入/輸出單價更低（$2/$10 vs $3/$15 per 1M tokens）
  model: "claude-sonnet-5"
  max_tokens: 4000
  # API key 走環境變數 ANTHROPIC_API_KEY，不要寫在這個檔案裡

# ── 通知 ────────────────────────────────────────────
notify:
  discord_enabled: true      # DISCORD_WEBHOOK_URL 走環境變數
  telegram_enabled: true     # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 走環境變數
  # 兩個都設定好的話兩邊都會收到，互不影響；哪個 Secret 沒填就自動略過那個

# ── 各產業深度分析（排程「台股產業深度分析」→ python -m src.main industry-reports）──
# 以申報產業別為單位，37 類涵蓋全市場 2345 檔。個股層的公司判讀必須逐檔查證
# （40 檔/天要兩個月），但每檔股票一定屬於某一個產業，所以做完 37 份產業分析
# 就等於每一檔都有可靠的產業脈絡——而且過程中不需要臆測任何個別公司，送進
# LLM 的公司資訊全部是申報主要經營業務＋政府開放資料的月營收。
industry_report:
  batch_size: 6             # 每次分析幾類（連跑約一週補滿 37 類）
  refresh_days: 90          # 幾天後排入重新分析
  min_members: 3            # 家數太少的產業（例如存託憑證 4 檔）不值得單獨成篇
